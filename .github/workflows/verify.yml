name: Verify Sweety Motion
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Start game server
        run: |
          python3 -m http.server 8765 >/tmp/sweety-server.log 2>&1 &
          sleep 2
      - name: Run mobile and desktop browser tests
        run: node tests/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sweety-motion-browser-screenshots
          path: test-results/
