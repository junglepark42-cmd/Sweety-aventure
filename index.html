<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#39205e"><title>Sweety Motion — La pluie de bonbons</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Trebuchet MS",sans-serif;background:#281642;color:white}body{touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block}#cameraFeed{display:none}#top{position:fixed;z-index:3;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:none;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}#top>*{background:#371950bf;border:2px solid #ffffff6a;border-radius:20px;padding:10px 16px;box-shadow:0 5px 18px #28164255;font-weight:900;font-size:clamp(15px,3vw,24px)}#top button{pointer-events:auto}button{border:0;cursor:pointer;touch-action:manipulation;font:900 clamp(15px,3vw,21px) system-ui;border-radius:18px;padding:14px 22px;box-shadow:0 7px 0 #8f3e85,0 11px 20px #26103b55;color:#49205e;background:linear-gradient(#fff4a8,#ffca58);transition:transform .12s}button:active{transform:translateY(5px);box-shadow:0 2px 0 #8f3e85}button.secondary{background:linear-gradient(#fce3ff,#d8a8ff);box-shadow:0 7px 0 #8853ab,0 11px 20px #26103b55}button:disabled{opacity:.5;cursor:wait}#overlay{position:fixed;z-index:5;inset:0;display:grid;place-items:center;padding:16px;overflow:auto}#panel{width:min(96vw,580px);max-height:94dvh;overflow:auto;text-align:center;border:3px solid #fff9;border-radius:30px;background:linear-gradient(155deg,#8d51cfe8,#573097ee);box-shadow:0 20px 70px #210d48b0,inset 0 2px #fff8;padding:clamp(16px,3vw,30px)}h1{margin:4px 0 0;font-size:clamp(38px,9vw,68px);line-height:1;letter-spacing:1px;color:#ffdf7b;text-shadow:0 4px #9e3c9d,0 7px #401f72}h2{margin:10px 0 8px;color:#fff5ba;font-size:clamp(20px,4vw,28px)}p{margin:10px auto 15px;max-width:410px;font-size:clamp(14px,2.6vw,18px);line-height:1.35}.actions{display:grid;gap:12px;margin:16px auto;max-width:360px}.characters{display:flex;justify-content:center;gap:28px;margin:12px 0}.character{font-size:clamp(52px,11vw,90px);filter:drop-shadow(0 8px 5px #2b135d77);animation:bounce 2s ease-in-out infinite}.character:nth-child(2){animation-delay:-1s}@keyframes bounce{50%{transform:translateY(-12px) rotate(5deg)}}#status{min-height:20px;color:#ffefb2;font-weight:700;font-size:14px}#help{font-size:13px;opacity:.85}#top button{font-size:14px;padding:10px 15px;box-shadow:none}#score{font-variant-numeric:tabular-nums}@media(max-height:620px){#panel{padding:12px}.characters{margin:2px}.character{font-size:48px}.actions{gap:8px;margin:8px auto}button{padding:10px}p{margin:6px auto}h1{font-size:35px}}
</style></head><body>
<canvas id="game" aria-label="Jeu de bonbons"></canvas><video id="cameraFeed" playsinline muted autoplay></video>
<div id="top"><div id="score">🍬 0</div><div id="timer">⏱ 60</div><button id="pause" aria-label="Mettre en pause">Ⅱ</button></div>
<div id="overlay"><section id="panel"><h1>SWEETY</h1><h2 id="subtitle">LA PLUIE DE BONBONS</h2><div class="characters"><span class="character">🦄</span><span class="character">🦖</span></div><p id="description">Attrape les bonbons magiques avec tes mains ou ton doigt. Une minute de folie sucrée !</p><div class="actions" id="actions"><button id="touch">👆 JOUER AU DOIGT</button><button class="secondary" id="camera">📷 JOUER AVEC LA CAMÉRA</button><button class="secondary" id="sound">🔊 SON : ON</button></div><div id="status" role="status"></div><div id="help">Caméra facultative · Aucun enregistrement vidéo</div></section></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),video=document.getElementById('cameraFeed'),overlay=document.getElementById('overlay'),topbar=document.getElementById('top'),scoreEl=document.getElementById('score'),timerEl=document.getElementById('timer'),status=document.getElementById('status'),actions=document.getElementById('actions'),subtitle=document.getElementById('subtitle'),description=document.getElementById('description');
let W=0,H=0,dpr=1,state='menu',mode='touch',score=0,remaining=60,spawn=0,items=[],particles=[],hands=[],pointer=null,stream=null,tracker=null,detectBusy=false,clock=performance.now(),soundOn=true,audio=null,stars=[];
const rnd=(a,b)=>a+Math.random()*(b-a);
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:38},()=>({x:Math.random()*W,y:Math.random()*H,r:rnd(1,3),phase:rnd(0,7)}))}
addEventListener('resize',resize);resize();
function beep(f=600){if(!soundOn)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.3,audio.currentTime+.1);g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.12)}catch{}}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function backdrop(t){const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#77a8ef');grad.addColorStop(.58,'#d9a5f2');grad.addColorStop(1,'#fbc2e4');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=.3+.3*Math.sin(t+s.phase);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}ctx.globalAlpha=1;for(let i=0;i<7;i++){const x=(i/6)*W+Math.sin(t*.15+i)*15,y=H*.19+Math.sin(i*4+t*.12)*H*.13;ctx.fillStyle='#fff7';for(let j=0;j<4;j++){ctx.beginPath();ctx.ellipse(x+(j-1.5)*26,y+Math.sin(j)*7,40,22,0,0,7);ctx.fill()}}ctx.fillStyle='#b48de2';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+20;x+=20)ctx.lineTo(x,H*.79+Math.sin(x/W*8)*32);ctx.lineTo(W,H);ctx.fill();ctx.fillStyle='#8edac2';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+20;x+=20)ctx.lineTo(x,H*.89+Math.sin(x/W*12+2)*18);ctx.lineTo(W,H);ctx.fill();for(let i=0;i<9;i++){const x=i*W/8+10,y=H*.84+Math.sin(i*3)*15;ctx.strokeStyle='#d58db4';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x,y+45);ctx.lineTo(x,y);ctx.stroke();ctx.fillStyle=['#ff9ccc','#f8d272','#caa3fc'][i%3];ctx.beginPath();ctx.arc(x,y,13,0,7);ctx.fill();ctx.strokeStyle='#fff9';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,7,.3,5);ctx.stroke()}}
function candy(it,t){ctx.save();ctx.translate(it.x,it.y);ctx.rotate(Math.sin(t*2+it.phase)*.3);ctx.shadowColor=it.color;ctx.shadowBlur=18;const r=it.r;ctx.fillStyle=it.color;if(it.kind==='star'){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.46:r;ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}ctx.closePath();ctx.fill()}else if(it.kind==='lolly'){ctx.strokeStyle='#fff';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,r*.1);ctx.lineTo(0,r*1.5);ctx.stroke();ctx.beginPath();ctx.arc(0,0,r*.8,0,7);ctx.fill();ctx.strokeStyle='#fff8';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,r*.46,0,Math.PI*1.6);ctx.stroke()}else{ctx.beginPath();ctx.moveTo(-r*.6,-r*.4);ctx.lineTo(-r*1.45,-r*.7);ctx.lineTo(-r*1.35,r*.7);ctx.lineTo(-r*.6,r*.4);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(r*.6,-r*.4);ctx.lineTo(r*1.45,-r*.7);ctx.lineTo(r*1.35,r*.7);ctx.lineTo(r*.6,r*.4);ctx.closePath();ctx.fill();roundRect(-r*.7,-r*.65,r*1.4,r*1.3,r*.5);ctx.fill()}ctx.shadowBlur=0;ctx.fillStyle='#fff9';ctx.beginPath();ctx.ellipse(-r*.25,-r*.25,r*.24,r*.12,-.5,0,7);ctx.fill();ctx.restore()}
function start(which){stopCamera();mode=which;state='playing';score=0;remaining=60;spawn=0;items=[];particles=[];hands=[];pointer=null;overlay.style.display='none';topbar.style.display='flex';scoreEl.textContent='🍬 0';timerEl.textContent='⏱ 60';if(which==='camera')openCamera()}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;hands=[]}
function menu(){stopCamera();state='menu';overlay.style.display='grid';topbar.style.display='none';subtitle.textContent='LA PLUIE DE BONBONS';description.textContent='Attrape les bonbons magiques avec tes mains ou ton doigt. Une minute de folie sucrée !';actions.innerHTML='<button id="touch">👆 JOUER AU DOIGT</button><button class="secondary" id="camera">📷 JOUER AVEC LA CAMÉRA</button><button class="secondary" id="sound">🔊 SON : '+(soundOn?'ON':'OFF')+'</button>';document.getElementById('touch').onclick=()=>start('touch');document.getElementById('camera').onclick=()=>start('camera');document.getElementById('sound').onclick=()=>{soundOn=!soundOn;document.getElementById('sound').textContent='🔊 SON : '+(soundOn?'ON':'OFF')};status.textContent=''}
function end(){state='end';stopCamera();topbar.style.display='none';overlay.style.display='grid';let best=score;try{best=Math.max(score,Number(localStorage.getItem('sweety-motion-best')||0));localStorage.setItem('sweety-motion-best',String(best))}catch{}subtitle.textContent='🎉 BRAVO !';description.textContent='Tu as gagné '+score+' points ! ⭐ Record : '+best;actions.innerHTML='<button id="again">🔁 REJOUER</button><button class="secondary" id="home">🏠 ACCUEIL</button>';document.getElementById('again').onclick=()=>start(mode);document.getElementById('home').onclick=menu;status.textContent='SWEETY CHAMPION !'}
document.getElementById('pause').onclick=()=>{if(state==='playing'){state='paused';overlay.style.display='grid';subtitle.textContent='PETITE PAUSE';description.textContent='Prêt à reprendre la pluie de bonbons ?';actions.innerHTML='<button id="resume">▶ REPRENDRE</button><button class="secondary" id="home">🏠 ACCUEIL</button>';document.getElementById('resume').onclick=()=>{state='playing';overlay.style.display='none'};document.getElementById('home').onclick=menu}};
function pointerAt(e){pointer={x:e.clientX,y:e.clientY};if(state==='playing'&&mode==='touch')collect(pointer.x,pointer.y)}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointerAt(e)});canvas.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pointerAt(e)});canvas.addEventListener('pointerup',()=>pointer=null);
function collect(x,y){for(let i=items.length-1;i>=0;i--){const it=items[i],dx=x-it.x,dy=y-it.y;if(dx*dx+dy*dy<(it.r+34)**2){score+=it.kind==='star'?50:it.kind==='lolly'?20:10;scoreEl.textContent='🍬 '+score;beep(it.kind==='star'?900:540);for(let j=0;j<12;j++)particles.push({x:it.x,y:it.y,vx:rnd(-170,170),vy:rnd(-180,40),life:.6,color:it.color});items.splice(i,1)}}}
async function loadScript(url){if(document.querySelector('script[data-hands]'))return;await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=url;s.dataset.hands='1';s.onload=resolve;s.onerror=()=>{s.remove();reject(Error('Chargement de la reconnaissance impossible'))};document.head.appendChild(s)})}
async function openCamera(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Caméra indisponible sur ce navigateur');stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}});video.srcObject=stream;await video.play();await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js');if(!tracker){tracker=new window.Hands({locateFile:file=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+file});tracker.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.55,minTrackingConfidence:.5});tracker.onResults(r=>{hands=(r.multiHandLandmarks||[]).map(h=>({x:(1-h[8].x)*W,y:h[8].y*H}))})}}catch(err){stopCamera();if(state==='playing'&&mode==='camera'){mode='touch';state='paused';overlay.style.display='grid';subtitle.textContent='JOUONS AU DOIGT !';description.textContent='La caméra ne peut pas démarrer. Tu peux jouer directement avec ton doigt.';actions.innerHTML='<button id="continue">👆 CONTINUER AU DOIGT</button><button class="secondary" id="home">🏠 ACCUEIL</button>';document.getElementById('continue').onclick=()=>{state='playing';overlay.style.display='none'};document.getElementById('home').onclick=menu;status.textContent=err.message}}}
async function detect(){if(detectBusy||!tracker||!stream||video.readyState<2||state!=='playing'||mode!=='camera')return;detectBusy=true;try{await tracker.send({image:video})}catch{hands=[]}finally{detectBusy=false}}
function frame(now){const dt=Math.min((now-clock)/1000,.05);clock=now;const t=now/1000;backdrop(t);if(state==='playing'){remaining-=dt;if(remaining<=0){remaining=0;end()}else{timerEl.textContent='⏱ '+Math.ceil(remaining);spawn-=dt;if(spawn<=0){spawn=Math.max(.22,.65-(60-remaining)*.004);const r=rnd(17,27),kind=Math.random()<.12?'star':Math.random()<.25?'lolly':'candy';items.push({x:rnd(35,Math.max(36,W-35)),y:-45,r,color:['#ff77a8','#ffd55f','#9a79f9','#71e6c3','#ff9b65'][Math.floor(rnd(0,5))],kind,vy:rnd(110,180)+(60-remaining)*1.4,phase:rnd(0,7)})}for(let i=items.length-1;i>=0;i--){items[i].y+=items[i].vy*dt;if(items[i].y>H+60)items.splice(i,1)}if(mode==='touch'&&pointer)collect(pointer.x,pointer.y);if(mode==='camera'){for(const h of hands)collect(h.x,h.y);detect()}}}for(const it of items)candy(it,t);for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=280*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life/.6);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();if(p.life<=0)particles.splice(i,1)}ctx.globalAlpha=1;if(state==='playing'){const cursors=mode==='camera'?hands:pointer?[pointer]:[];for(const p of cursors){ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.shadowColor='#ffdc67';ctx.shadowBlur=20;ctx.beginPath();ctx.arc(p.x,p.y,25+Math.sin(t*7)*3,0,7);ctx.stroke();ctx.shadowBlur=0}}requestAnimationFrame(frame)}
menu();requestAnimationFrame(frame);
})();
</script></body></html>
