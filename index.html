<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#472381"><title>Sweety Motion — La pluie de bonbons</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#261447;color:white;font-family:system-ui,sans-serif}body{touch-action:none}#stage{position:fixed;inset:0;width:100%;height:100%}#cam{display:none}#hud{position:fixed;z-index:3;top:env(safe-area-inset-top,0);left:0;right:0;padding:12px;display:none;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}#hud>*{background:#63278bcf;border:2px solid #fff9;border-radius:18px;padding:10px 16px;font-weight:900;box-shadow:0 6px 15px #27104880}#hud button{pointer-events:auto}button{border:3px solid #fff9;border-radius:19px;background:linear-gradient(#ffe995,#ffbc43);color:#51205d;font:900 clamp(15px,3.2vw,23px) system-ui;padding:13px 18px;box-shadow:0 6px 0 #a54c85,0 9px 20px #210b4188;cursor:pointer}button.blue{background:linear-gradient(#81eaff,#2395ef);color:#fff;box-shadow:0 6px 0 #1662b0}button.pink{background:linear-gradient(#ff91df,#ed32a1);color:white;box-shadow:0 6px 0 #a92281}button:active{transform:translateY(4px)}#screen{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:12px;overflow:auto}#panel{width:min(95vw,620px);max-height:95dvh;overflow:auto;border-radius:32px;border:3px solid #fff9;background:linear-gradient(145deg,#a756d6ee,#5925a0f2);text-align:center;padding:clamp(12px,3vw,26px);box-shadow:0 20px 80px #18073fa9}h1{font-size:clamp(40px,9vw,74px);line-height:.95;color:#ffe87e;text-shadow:0 5px #e42e9f,0 9px #56257f;margin:8px 0 4px}h2{font-size:clamp(18px,4vw,28px);margin:8px 0;color:#fff0b3}p{font-size:clamp(14px,2.7vw,18px);margin:9px auto 15px;max-width:440px}.mascots{height:clamp(100px,24vh,230px);display:flex;align-items:end;justify-content:center;gap:15px}.mascots img{height:100%;width:auto;max-width:46%;object-fit:contain;filter:drop-shadow(0 9px 6px #271348aa);animation:float 2s ease-in-out infinite}.mascots img:nth-child(2){animation-delay:-1s}@keyframes float{50%{transform:translateY(-12px)}}#buttons{display:grid;gap:12px;max-width:390px;margin:16px auto}#msg{min-height:20px;font-size:13px;color:#fff4b3}#hud button{font-size:16px;box-shadow:none;padding:7px 12px}@media(max-height:620px){.mascots{height:75px}#panel{padding:10px}h1{font-size:37px}#buttons{gap:7px;margin:8px auto}button{padding:9px}p{margin:5px auto}}
</style></head><body><canvas id="stage"></canvas><video id="cam" autoplay playsinline muted></video><div id="hud"><span id="score">🍬 0</span><span id="time">⏱ 60</span><button id="pause">Ⅱ</button></div><div id="screen"><div id="panel"><h1>SWEETY MOTION</h1><h2 id="title">LA PLUIE DE BONBONS</h2><div class="mascots"><img src="assets/unicorn.png" alt="Licorne Sweety"><img src="assets/dino.png" alt="Dinosaure Sweety"></div><p id="description">Attrape les bonbons avec tes mains devant la caméra, ou joue au doigt !</p><div id="buttons"><button class="pink" id="camera">📷 JOUER AVEC LA CAMÉRA</button><button class="blue" id="touch">👆 JOUER AU DOIGT</button><button id="sound">🔊 SON : ON</button></div><div id="msg" role="status"></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('stage'),ctx=c.getContext('2d'),video=$('cam'),screen=$('screen'),hud=$('hud'),buttons=$('buttons'),msg=$('msg');const art={};for(const [key,path] of Object.entries({bg:'assets/forest.webp',candy:'assets/candy.png',star:'assets/star.png'})){const im=new Image();im.src=path;art[key]=im}let W=0,H=0,D=1,state='menu',mode='touch',items=[],fx=[],hands=[],pointer=null,score=0,seconds=60,spawn=0,last=performance.now(),stream=null,detector=null,busy=false,audio=null,sound=true;const rnd=(a,b)=>a+Math.random()*(b-a);
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
function beep(f){if(!sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.12)}catch{}}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;hands=[]}
function show(title,desc,html){screen.style.display='grid';hud.style.display='none';$('title').textContent=title;$('description').textContent=desc;buttons.innerHTML=html;msg.textContent=''}
function menu(){state='menu';stopCam();show('LA PLUIE DE BONBONS','Attrape les bonbons avec tes mains devant la caméra, ou joue au doigt !','<button class="pink" id="camera">📷 JOUER AVEC LA CAMÉRA</button><button class="blue" id="touch">👆 JOUER AU DOIGT</button><button id="sound">🔊 SON : '+(sound?'ON':'OFF')+'</button>');$('touch').onclick=()=>start('touch');$('camera').onclick=()=>start('camera');$('sound').onclick=()=>{sound=!sound;$('sound').textContent='🔊 SON : '+(sound?'ON':'OFF')}}
function start(m){stopCam();mode=m;state='playing';score=0;seconds=60;spawn=0;items=[];fx=[];pointer=null;screen.style.display='none';hud.style.display='flex';$('score').textContent='🍬 0';$('time').textContent='⏱ 60';if(m==='camera')openCamera()}
function finish(){state='end';stopCam();let best=score;try{best=Math.max(score,Number(localStorage.getItem('sweety-motion-record')||0));localStorage.setItem('sweety-motion-record',best)}catch{}show('BRAVO ! 🎉','Tu as gagné '+score+' points ! Record : '+best,'<button class="pink" id="again">🔁 REJOUER</button><button class="blue" id="home">🏠 ACCUEIL</button>');$('again').onclick=()=>start(mode);$('home').onclick=menu}
$('pause').onclick=()=>{if(state!=='playing')return;state='paused';show('PETITE PAUSE','On reprend la pluie de bonbons ?','<button class="pink" id="resume">▶ REPRENDRE</button><button class="blue" id="home">🏠 ACCUEIL</button>');$('resume').onclick=()=>{state='playing';screen.style.display='none';hud.style.display='flex'};$('home').onclick=menu};
function touch(e){pointer={x:e.clientX,y:e.clientY};if(state==='playing'&&mode==='touch')collect(pointer.x,pointer.y)}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);touch(e)});c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')touch(e)});c.addEventListener('pointerup',()=>pointer=null);
function collect(x,y){for(let i=items.length-1;i>=0;i--){const b=items[i];if((x-b.x)**2+(y-b.y)**2<(b.r+35)**2){score+=b.special?50:10;$('score').textContent='🍬 '+score;beep(b.special?880:550);for(let j=0;j<14;j++)fx.push({x:b.x,y:b.y,vx:rnd(-190,190),vy:rnd(-190,80),life:.55,color:b.special?'#ffe46a':'#ff78d6'});items.splice(i,1)}}}
async function loadHands(){if(window.Hands)return;await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js';s.onload=ok;s.onerror=()=>fail(Error('Module de reconnaissance indisponible'));document.head.append(s)})}
async function openCamera(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Caméra non disponible');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});video.srcObject=stream;await video.play();await loadHands();if(!detector){detector=new window.Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});detector.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.55,minTrackingConfidence:.5});detector.onResults(r=>{hands=(r.multiHandLandmarks||[]).map(h=>({x:(1-h[8].x)*W,y:h[8].y*H}))})}}catch(e){stopCam();if(state==='playing'&&mode==='camera'){mode='touch';state='paused';show('MODE TACTILE','Caméra indisponible. Tu peux continuer en touchant les bonbons.','<button class="blue" id="continue">👆 CONTINUER AU DOIGT</button><button id="home">ACCUEIL</button>');msg.textContent=e.message;$('continue').onclick=()=>{state='playing';screen.style.display='none';hud.style.display='flex'};$('home').onclick=menu}}}
async function detect(){if(busy||!detector||!stream||video.readyState<2||state!=='playing'||mode!=='camera')return;busy=true;try{await detector.send({image:video})}catch{hands=[]}finally{busy=false}}
function drawImage(img,x,y,w,h){if(img.complete&&img.naturalWidth){ctx.drawImage(img,x,y,w,h);return true}return false}
function background(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#80bbff');g.addColorStop(1,'#f4a8d6');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);if(art.bg.complete&&art.bg.naturalWidth){const ratio=Math.max(W/art.bg.width,H/art.bg.height),iw=art.bg.width*ratio,ih=art.bg.height*ratio;ctx.drawImage(art.bg,(W-iw)/2,(H-ih)/2,iw,ih)}if(mode==='camera'&&stream&&video.readyState>=2){const vw=video.videoWidth,vh=video.videoHeight,scale=Math.max(W/vw,H/vh),dw=vw*scale,dh=vh*scale;ctx.save();ctx.globalAlpha=.87;ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(video,(W-dw)/2,(H-dh)/2,dw,dh);ctx.restore()}}
function render(now){const dt=Math.min((now-last)/1000,.05);last=now;background();if(state==='playing'){seconds-=dt;if(seconds<=0){seconds=0;finish()}else{$('time').textContent='⏱ '+Math.ceil(seconds);spawn-=dt;if(spawn<=0){spawn=Math.max(.24,.7-(60-seconds)*.005);items.push({x:rnd(35,Math.max(36,W-35)),y:-50,r:rnd(22,34),vy:rnd(120,185)+(60-seconds)*1.2,special:Math.random()<.16})}for(let i=items.length-1;i>=0;i--){items[i].y+=items[i].vy*dt;if(items[i].y>H+70)items.splice(i,1)}if(mode==='camera'){for(const h of hands)collect(h.x,h.y);detect()}else if(pointer)collect(pointer.x,pointer.y)}}for(const b of items){ctx.save();ctx.shadowColor=b.special?'#ffe45b':'#ff6ecf';ctx.shadowBlur=22;const img=b.special?art.star:art.candy;if(!drawImage(img,b.x-b.r,b.y-b.r,b.r*2,b.r*2)){ctx.fillStyle=b.special?'#ffe65b':'#f768b8';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill()}ctx.restore()}for(let i=fx.length-1;i>=0;i--){const p=fx[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=280*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life/.55);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,5,0,Math.PI*2);ctx.fill();if(p.life<=0)fx.splice(i,1)}ctx.globalAlpha=1;if(state==='playing'){for(const p of(mode==='camera'?hands:pointer?[pointer]:[])){ctx.strokeStyle='#fff';ctx.lineWidth=5;ctx.shadowColor='#53edff';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(p.x,p.y,29,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0}}requestAnimationFrame(render)}
menu();requestAnimationFrame(render);
})();</script></body></html>
