<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#512b8e"><title>Sweety Motion · La pluie de bonbons</title>
<style>
:root{font-family:system-ui,"Trebuchet MS",sans-serif;color:#fff;background:#241348}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{touch-action:none}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;inset:env(safe-area-inset-top) 10px auto;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none;font-size:clamp(16px,3.4vw,29px);font-weight:1000;text-shadow:0 3px 8px #30133e}#hud span{background:#542c8ad9;border:2px solid #ffd5f1;border-radius:19px;padding:9px 15px}#hud[hidden]{display:none}#panelWrap{position:fixed;inset:0;display:grid;place-items:center;padding:15px;background:linear-gradient(150deg,#1e0d4edb,#5e2597e8);overflow:auto}#panelWrap[hidden]{display:none}#panel{width:min(100%,560px);max-height:calc(100dvh - 30px);overflow:auto;text-align:center;border:3px solid #ffce78;border-radius:30px;padding:clamp(16px,4vw,30px);background:linear-gradient(150deg,#8a46bd,#482279);box-shadow:0 18px 50px #160a39,inset 0 0 55px #f5a8d42a}h1{font-size:clamp(31px,7vw,56px);line-height:1;margin:12px 0 8px;color:#ffdf7c;text-shadow:0 5px #ad3e92}h2{font-size:clamp(19px,4vw,26px);margin:6px 0 14px}p{font-size:clamp(15px,3.6vw,19px);line-height:1.45}button{border:0;border-radius:18px;display:block;width:100%;font:900 clamp(17px,4vw,22px) system-ui;padding:15px 18px;margin:12px 0;background:#ffce4e;color:#462067;box-shadow:0 6px #d28d2a;cursor:pointer}button:active{transform:translateY(4px);box-shadow:0 2px #d28d2a}.secondary{background:#fff0fa;box-shadow:0 6px #cda1d2}.small{font-size:12px;opacity:.85}#exit{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));right:12px;width:auto;padding:10px 15px;font-size:13px;z-index:3;background:#ffffffdc;box-shadow:none}#exit[hidden]{display:none}#error{color:#ffdf7c;font-weight:700;min-height:1em}#status{position:fixed;bottom:12px;left:12px;background:#321753b8;padding:6px 10px;border-radius:9px;font-size:12px;pointer-events:none}#status[hidden]{display:none}#video{display:none}
.mascots{display:flex;justify-content:center;align-items:end;gap:clamp(10px,4vw,35px);height:clamp(80px,19vh,155px)}.mascots img{height:100%;width:auto;max-width:43%;object-fit:contain;filter:drop-shadow(0 8px 5px #24134899);animation:bob 2.3s ease-in-out infinite}.mascots img:nth-child(2){animation-delay:-1.2s}@keyframes bob{50%{transform:translateY(-9px)}}@media(max-height:630px){.mascots{height:72px}#panel{padding:12px}h1{font-size:30px}h2{font-size:18px;margin:4px}p{margin:7px;font-size:14px}button{padding:9px;margin:7px 0}}
</style></head><body><video id="video" autoplay muted playsinline></video><canvas id="game" width="1280" height="720" aria-label="Jeu Sweety Motion"></canvas><div id="hud" hidden><span id="score">BONBONS 0</span><span id="timer">2:00</span></div><button id="exit" hidden>QUITTER</button><div id="status" hidden></div>
<div id="panelWrap"><div id="panel"><div class="mascots"><img src="../assets/characters/unicorn/idle-00.png" alt="Licorne Sweety"><img src="../assets/characters/dino/idle-00.png" alt="Dinosaure Sweety"></div><h1>SWEETY<br>MOTION</h1><h2>LA PLUIE DE BONBONS</h2><p id="message">Attrape les bonbons avec tes mains devant la caméra ! Une partie dure 2 minutes.</p><button id="camera">JOUER AVEC LA CAMÉRA</button><button id="demo" class="secondary">ESSAYER AU DOIGT</button><div id="error" role="alert"></div><p class="small">La vidéo est traitée dans le navigateur, sans enregistrement. Le module de reconnaissance est chargé depuis MediaPipe.</p></div></div>
<script>
(()=>{'use strict';
const W=1280,H=720,canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),video=document.getElementById('video'),wrap=document.getElementById('panelWrap'),hud=document.getElementById('hud'),exit=document.getElementById('exit'),status=document.getElementById('status'),error=document.getElementById('error'),scoreEl=document.getElementById('score'),timerEl=document.getElementById('timer'),message=document.getElementById('message');
let mode='menu',stream=null,model=null,processing=false,points=[],sweets=[],sparks=[],score=0,ends=0,spawn=0,last=performance.now(),tracked=false;
const random=(a,b)=>a+Math.random()*(b-a);
let soundEnabled=true,audioCtx=null;function sound(freq=660,duration=.09){if(!soundEnabled)return;try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq,audioCtx.currentTime);osc.frequency.exponentialRampToValueAtTime(freq*1.5,audioCtx.currentTime+duration);gain.gain.setValueAtTime(.055,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);osc.connect(gain).connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+duration)}catch(e){}}
const art={};for(const [name,path] of Object.entries({forest:'../assets/backgrounds/forest.webp',candy:'../assets/collectibles/candy.png',star:'../assets/collectibles/star.png'})){const img=new Image();img.src=path;art[name]=img}
for(const img of document.querySelectorAll('.mascots img'))img.onerror=()=>{img.style.display='none'};
function setStatus(s){status.hidden=!s;status.textContent=s}
function fit(){const d=Math.min(devicePixelRatio||1,2);const w=Math.max(1,innerWidth),h=Math.max(1,innerHeight);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}
addEventListener('resize',fit);fit();
function candy(x,y,r,color,type=0){ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(performance.now()/550+x)*.15);ctx.shadowColor=color;ctx.shadowBlur=15;ctx.fillStyle=color;if(type===0){ctx.beginPath();ctx.ellipse(0,0,r*1.1,r*.75,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-r,0);ctx.lineTo(-r*1.7,-r*.7);ctx.lineTo(-r*1.7,r*.7);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(r*1.7,-r*.7);ctx.lineTo(r*1.7,r*.7);ctx.closePath();ctx.fill()}else{ctx.beginPath();for(let i=0;i<10;i++){let a=i*Math.PI/5-Math.PI/2,k=i%2?r*.48:r;ctx.lineTo(Math.cos(a)*k,Math.sin(a)*k)}ctx.closePath();ctx.fill()}ctx.shadowBlur=0;ctx.strokeStyle='#fff8';ctx.lineWidth=5;ctx.stroke();ctx.restore()}
function render(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#6232b4');bg.addColorStop(.55,'#b35dce');bg.addColorStop(1,'#ffb4b9');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);if(art.forest.complete&&art.forest.naturalWidth){ctx.save();ctx.globalAlpha=.6;ctx.drawImage(art.forest,0,0,W,H);ctx.restore()}
if(video.readyState>=2&&mode==='camera'){ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(video,0,0,W,H);ctx.restore();ctx.fillStyle='#2b10564d';ctx.fillRect(0,0,W,H)}
for(let i=0;i<24;i++){let x=(i*197+Math.sin(now/1800+i)*35)%W,y=(i*173+now/45)%H;ctx.fillStyle=i%2?'#ffe5ff66':'#fff2a066';ctx.beginPath();ctx.arc(x,y,4+i%6,0,7);ctx.fill()}
if(mode==='camera'||mode==='demo'){if(now>=ends)finish();else{spawn-=dt;if(spawn<=0){sweets.push({x:random(75,W-75),y:-70,r:random(25,40),speed:random(130,240),color:['#ffda52','#ff6aa5','#81f0e5','#a7f57b'][Math.floor(random(0,4))],type:Math.random()<.2?1:0});spawn=random(.4,.72)}for(const s of sweets){s.y+=s.speed*dt;for(const p of points){if(Math.hypot(s.x-p.x,s.y-p.y)<s.r+40){s.hit=true;score+=s.type?50:10;sound(s.type?880:520,.07);for(let i=0;i<9;i++)sparks.push({x:s.x,y:s.y,vx:random(-180,180),vy:random(-180,180),life:.5});break}}}sweets=sweets.filter(s=>!s.hit&&s.y<H+80);scoreEl.textContent='🍬 '+score;let seconds=Math.max(0,Math.ceil((ends-now)/1000));timerEl.textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');if(mode==='camera'&&!processing&&video.readyState>=2)detect()}}
for(const s of sweets){const img=s.type?art.star:art.candy;if(img.complete&&img.naturalWidth){ctx.save();ctx.shadowColor=s.color;ctx.shadowBlur=20;ctx.drawImage(img,s.x-s.r*1.4,s.y-s.r*1.4,s.r*2.8,s.r*2.8);ctx.restore()}else candy(s.x,s.y,s.r,s.color,s.type)}
for(const p of points){ctx.beginPath();ctx.arc(p.x,p.y,27,0,7);ctx.lineWidth=7;ctx.strokeStyle='#ffea65';ctx.shadowColor='#fff';ctx.shadowBlur=15;ctx.stroke();ctx.shadowBlur=0}
for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle='#fff3a2';ctx.fillRect(p.x,p.y,9,9)}ctx.globalAlpha=1;sparks=sparks.filter(p=>p.life>0);
if(mode==='camera'&&!tracked){ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 28px system-ui';ctx.fillText('Montre tes mains à la caméra',W/2,H-45)}
requestAnimationFrame(render)}
function onHands(result){if(mode!=='camera')return;points=[];for(const h of result.multiHandLandmarks||[]){for(const i of [0,8,12,16,20]){const p=h[i];points.push({x:(1-p.x)*W,y:p.y*H})}}tracked=points.length>0;setStatus(tracked?'Mains détectées':'Place tes mains devant la caméra')}
async function detect(){if(!model||processing||mode!=='camera')return;processing=true;try{await model.send({image:video})}catch(e){setStatus('Détection momentanément indisponible')}finally{processing=false}}
function loadHands(){return new Promise((resolve,reject)=>{if(window.Hands)return resolve();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js';s.onload=resolve;s.onerror=()=>reject(new Error('Module caméra indisponible. Vérifie Internet ou utilise le mode tactile.'));document.head.appendChild(s)})}
async function cameraStart(){error.textContent='';document.getElementById('camera').disabled=true;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('La caméra nécessite HTTPS et un navigateur compatible.');setStatus('Chargement de la caméra…');await loadHands();if(!stream){stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play()}if(!model){model=new window.Hands({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f});model.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.55,minTrackingConfidence:.5});model.onResults(onHands)}begin('camera')}catch(e){setStatus('');error.textContent='Caméra non disponible : '+e.message}finally{document.getElementById('camera').disabled=false}}
function begin(m){mode=m;score=0;points=[];sweets=[];sparks=[];spawn=0;tracked=false;ends=performance.now()+120000;wrap.hidden=true;hud.hidden=false;exit.hidden=false;setStatus(m==='demo'?'MODE TACTILE — déplace ton doigt':'Recherche des mains…')}
function finish(){if(mode==='camera'&&stream){stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null}mode='menu';hud.hidden=true;exit.hidden=true;wrap.hidden=false;message.textContent='Bravo ! Tu as gagné '+score+' points. Tu veux rejouer ?';document.querySelector('h2').textContent='SCORE : '+score;setStatus('')}
function pointer(e){if(mode!=='demo')return;const r=canvas.getBoundingClientRect();points=[{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}]}
canvas.addEventListener('pointerdown',e=>{pointer(e);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',pointer);canvas.addEventListener('pointerup',()=>{if(mode==='demo')points=[]});
const soundButton=document.createElement('button');soundButton.className='secondary';soundButton.textContent='🔊 SON : ON';document.getElementById('panel').insertBefore(soundButton,error);soundButton.onclick=()=>{soundEnabled=!soundEnabled;soundButton.textContent=soundEnabled?'🔊 SON : ON':'🔇 SON : OFF'};
document.getElementById('camera').addEventListener('click',cameraStart);document.getElementById('demo').addEventListener('click',()=>begin('demo'));exit.addEventListener('click',finish);addEventListener('pagehide',()=>{stream?.getTracks().forEach(t=>t.stop())});requestAnimationFrame(render);
})();
</script></body></html>
